controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    front_ackermann_controller:
      type: athena_drive_controllers/FrontAckermannController

    crab_steering_controller:
      type: athena_drive_controllers/CrabSteeringController

    double_ackermann_controller:
      type: athena_drive_controllers/DoubleAckermannController

    swerve_drive_controller:
      type: athena_drive_controllers/SwerveDriveController
    
    drive_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    drive_position_controller:
      type: position_controllers/JointGroupPositionController

    # LED GPIO Controller
    drive_led_gpio_controller:
      type: gpio_controllers/GpioCommandController

    # PowerModule GPIO Controller
    power_module_gpio_controller:
      type: gpio_controllers/GpioCommandController

    motor_status_controller:
      type: general_controllers/MotorStatusController
    
    rear_ackermann_controller:
      type: athena_drive_controllers/RearAckermannController

ackermann_steering_controller:
  # unsure why but ackermann controller only goes about half of scale_linear.x in teleop_twist
  # ackermann controller turns to at max scale_angular.yaw*pi. Seems to ignore how much you input, relies more on how fast rover is going
  ros__parameters:
    rear_wheels_names: ["propulsion_bl_joint", "propulsion_br_joint"] # This is traction control "propulsion_bl_joint", "propulsion_br_joint", 
    front_wheels_names: ["steer_fl_joint", "steer_fr_joint"] # This is steering, don't ask why its just called front wheels
    # front_steering_names: ["steer_fl_joint", "steer_fr_joint"]
    front_wheel_track: 0.6604
    rear_wheel_track: 0.6604
    wheelbase: 0.8382
    front_wheels_radius: 0.254
    rear_wheels_radius: 0.254
    use_stamped_vel: true

front_ackermann_controller:
  ros__parameters:
    drive_joints:
      - propulsion_fl_joint
      - propulsion_fr_joint
      - propulsion_bl_joint
      - propulsion_br_joint
    steer_joints:
      - steer_fl_joint
      - steer_fr_joint
    wheelbase: 0.8382
    track_width: 0.6604
    wheel_radius: 0.125
    # Odometry
    open_loop: false
    enable_odom_tf: false
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    velocity_rolling_window_size: 10

crab_steering_controller:
  ros__parameters:
    front_left_drive_joint: propulsion_fl_joint
    front_right_drive_joint: propulsion_fr_joint
    rear_left_drive_joint: propulsion_bl_joint
    rear_right_drive_joint: propulsion_br_joint
    front_left_swerve_joint: steer_fl_joint
    front_right_swerve_joint: steer_fr_joint
    rear_left_swerve_joint: steer_bl_joint
    rear_right_swerve_joint: steer_br_joint
    wheel_radius: 0.125

double_ackermann_controller:
  ros__parameters:
    front_left_drive_joint: propulsion_fl_joint
    front_right_drive_joint: propulsion_fr_joint
    rear_left_drive_joint: propulsion_bl_joint
    rear_right_drive_joint: propulsion_br_joint
    front_left_swerve_joint: steer_fl_joint
    front_right_swerve_joint: steer_fr_joint
    rear_left_swerve_joint: steer_bl_joint
    rear_right_swerve_joint: steer_br_joint
    track_width: 0.6604
    wheelbase: 0.8382
    wheel_radius: 0.125

swerve_drive_controller:
  ros__parameters:
    front_left_drive_joint: propulsion_fl_joint
    front_right_drive_joint: propulsion_fr_joint
    rear_left_drive_joint: propulsion_bl_joint
    rear_right_drive_joint: propulsion_br_joint
    front_left_swerve_joint: steer_fl_joint
    front_right_swerve_joint: steer_fr_joint
    rear_left_swerve_joint: steer_bl_joint
    rear_right_swerve_joint: steer_br_joint
    track_width: 0.6604
    wheelbase: 0.8382
    wheel_radius: 0.125

drive_velocity_controller:
  ros__parameters:
    joints:
      - propulsion_fl_joint
      - propulsion_fr_joint
      - propulsion_bl_joint
      - propulsion_br_joint
      - steer_fl_joint
      - steer_fr_joint
    interface_name: velocity

drive_position_controller:
  ros__parameters:
    joints:
      - propulsion_fl_joint
      - propulsion_fr_joint
      - propulsion_bl_joint
      - propulsion_br_joint
      - steer_fl_joint
      - steer_fr_joint
    interface_name: position

# LED GPIO Controller Configuration
drive_led_gpio_controller:
  ros__parameters:
    gpios:
      - drive_led
    command_interfaces:
      drive_led:
        interfaces:
          - red
          - green
          - blue

# PowerModule GPIO Controller Configuration
power_module_gpio_controller:
  ros__parameters:
    gpios:
      - drive_power_module
    command_interfaces:
      drive_power_module:
        interfaces:
          - kill_all
          - kill_jetson
          - kill_main
          - kill_by_voltage
    state_interfaces:
      drive_power_module:
        interfaces:
          - kill_all_sent
          - kill_jetson_sent
          - kill_main_sent
          - kill_by_voltage_sent

# Default command interfaces: 
# - status_request
# - maintenance_request
# - maintenance_frame_high
# - maintenance_frame_low
# - maintenance_data_count

# Default state interfaces:
# - motor_temperature
# - torque_current
# - status
motor_status_controller:
  ros__parameters:
    joints:
      - propulsion_fl_joint
      - propulsion_fr_joint
      - propulsion_bl_joint
      - propulsion_br_joint
    gpios:
      - drive_led
      - drive_power_module
    command_interfaces:
      drive_led:
        interfaces:
          - status_request
      drive_power_module:
        interfaces:
          - status_request
    state_interfaces:
      drive_led:
        interfaces:
          - status
      drive_power_module:
        interfaces:
          - status
    publish_rate: 10.0


rear_ackermann_controller:
  ros__parameters:
    steer_joints:
      - steer_bl_joint
      - steer_br_joint
    drive_joints:
      - propulsion_fl_joint
      - propulsion_fr_joint
      - propulsion_bl_joint
      - propulsion_br_joint
    wheelbase: 0.8382
    track_width: 0.645
    wheel_radius: 0.125
    max_speed: 0.59
    max_steer_angle: 0.785398
