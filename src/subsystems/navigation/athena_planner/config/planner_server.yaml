planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["SmacPlanner"]

    SmacPlanner:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # General settings
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 10000
      max_on_approach_iterations: 1000
      smooth_path: true

      # Motion model specific
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 1.0  # meters, tune for your rover
      reverse_penalty: 0.0
      change_penalty: 0.0

      # Grid configuration
      grid_prune: true
      use_astar_goal_heuristic: true
      allow_reverse: false  # forward-only Dubin paths
      analytic_expansion_ratio: 3.5